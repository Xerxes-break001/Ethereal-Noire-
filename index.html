
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Noire</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #0a0a0a;
        color: #f2eee9;
        font-family: Arial, sans-serif;
    }
        .hero {
    min-height: 100vh;
    padding: 120px 8%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.eyebrow {
    color: #32164f;
    font-size: 14px;
    letter-spacing: 4px;
    margin-bottom: 24px;
}

.hero h1 {
    font-size: clamp(48px, 8vw, 110px);
    line-height: 0.95;
    letter-spacing: -3px;
    max-width: 1000px;
}

.hero h1 span {
    color: #32164f;
}

.hero-text {
    margin-top: 32px;
    max-width: 430px;
    color: #aaa;
    font-size: 17px;
    line-height: 1.6;
}

.hero-button {
    display: inline-block;
    width: fit-content;
    margin-top: 40px;
    padding: 15px 28px;
    border: 1px solid #32164f;
    color: #f2eee9;
    text-decoration: none;
    letter-spacing: 2px;
    font-size: 12px;
}
    </style>
    
</head>

<body>
    
    
<header class="hero">
    <p class="eyebrow">ETHEREAL NOIRE</p>

    <h1>
        WHERE DARKNESS<br>
        <span>BECOMES ELEGANCE.</span>
    </h1>

    <p class="hero-text">
        A study in shadow, texture, and modern luxury.
    </p>

    <a href="#collection" class="hero-button">
        EXPLORE COLLECTION
    </a>
</header>
</body>
</html>
